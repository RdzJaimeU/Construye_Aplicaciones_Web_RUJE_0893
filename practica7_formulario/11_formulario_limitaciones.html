<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con limitaciones</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con limitaciones</h2>
    <!-- Formulario con restricciones en los campos -->
    <form action="" method="post">
        Ingresa tu nombre:
        <br>
        <!-- Desahbilitacion de campo: el atributo disabled impide la interaccion del usuario -->
        <input type="text" name="nombre" disabled><br>
        <!-- Limitacion de caracteres: maxlength fija el limite a 5 caracteres -->
        Contraseña:
        <br>
        <input type="password" name="pass" maxlength="5"><br>
        <!-- Solo lectura: readonly permite leer el contenido pero no editarlo ni borrarlo -->
        Comentarios:
        <br>
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
