<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con checkbox</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formularios con checkbox</h2>
    <!-- Formulario para seleccion multiple mediante casillas de verificacion -->
    <form action="" method="post">
        <!-- Texto para pedir el nombre -->
        Ingresa tu nombre:
        <!-- Campo de texto para el nombre -->
        <input type="text" name="nombre">
        <br>
        <!-- Texto para indicar la seleccion -->
        Selecciona los lenguajes que conozcas:
        <br>
        <!-- Casillas de tipo checkbox que permiten marcar varias opciones simultaneamente -->
        <input type="checkbox" name="Java">Java <br>
        <input type="checkbox" name="Python"> Python <br>
        <input type="checkbox" name="C#">C# <br>
        <input type="checkbox" name="Flutter"> Flutter <br>
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
