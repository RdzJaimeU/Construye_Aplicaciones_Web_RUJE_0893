<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con seleccion</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formularios con seleccion</h2>
    <!-- Formulario con lista desplegable -->
    <form action="" method="post">
        <!-- Texto para pedir el nombre -->
        Ingresa tu nombre:
        <!-- Campo de texto para el nombre -->
        <input type="text" name="nombre">
        <br>
        <!-- Texto para indicar la seleccion -->
        Selecciona tu pais:
        <!-- Elemento select para desplegar la lista de opciones -->
        <select name="pais">
            <option value="1">Argentina</option>
            <option value="2">España</option>
            <option value="3">Mexico</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select>
        <br>
        <!-- Boton para enviar -->
        <input type="submit" value="enviar">
        <!-- Boton para borrar -->
        <input type="reset" value="borrar">
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
