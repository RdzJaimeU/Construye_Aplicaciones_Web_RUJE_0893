<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con text area</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con text area</h2>
    <!-- Formulario para ingresar nombre, correo y comentarios -->
    <form action="" method="post">
        <!-- Texto para pedir el nombre -->
        Ingresa tu nombre:
        <!-- Campo de texto para el nombre -->
        <input type="text" name="nombre">
        <br>
        <!-- Texto para pedir el correo -->
        Ingresa tu correo:
        <!-- Campo de tipo email que valida el formato de correo electronico -->
        <input type="email" name="correo">
        <br>
        <!-- Texto para pedir los comentarios -->
        Ingresa tus comentarios:
        <!-- Area de texto multilineas con filas y columnas definidas -->
        <textarea name="comentarios" rows="1" cols="10"></textarea>
        <br>
        <!-- Boton para enviar los datos -->
        <input type="submit" value="enviar">
        <!-- Boton para borrar o restablecer el formulario -->
        <input type="reset" value="borrar">
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
