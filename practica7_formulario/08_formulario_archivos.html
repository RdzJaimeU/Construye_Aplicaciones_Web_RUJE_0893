<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con archivos</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con archivos</h2>
    <!-- Formulario para cargar archivos al servidor -->
    <form action="" method="post">
        <!-- Texto para pedir el nombre -->
        Ingresa tu nombre:
        <!-- Campo de texto para el nombre -->
        <input type="text" name="nombre">
        <br>
        <!-- Campo de tipo file para seleccionar un archivo del equipo -->
        <input type="file" name="archivo">
        <br>
        <!-- Boton de envio con icono -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
        <!-- Boton de borrado con icono -->
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
