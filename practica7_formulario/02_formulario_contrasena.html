<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para contraseñas</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario para contraseñas</h2>
    <!-- Formulario para ingresar credenciales de usuario -->
    <form action="" method="post">
        <!-- Texto para pedir el usuario -->
        Ingresa tu usuario:
        <!-- Campo para escribir el nombre de usuario -->
        <input type="text" name="usuario">
        <br>
        <!-- Texto para pedir la contrasena -->
        Ingresa tu contraseña:
        <!-- Campo tipo password para ocultar la clave con asteriscos o puntos por seguridad -->
        <input type="password" name="pass">
        <br>
        <!-- Boton para enviar los datos -->
        <input type="submit" value="enviar">
        <!-- Boton para borrar o restablecer los campos -->
        <input type="reset" value="borrar">
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
