<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con Radioboton</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formularios con Radioboton</h2>
    <!-- Formulario para seleccion unica con botones de opcion -->
    <form action="" method="post">
        <!-- Texto para pedir el nombre -->
        Ingresa tu nombre:
        <!-- Campo de texto para el nombre -->
        <input type="text" name="nombre">
        <br>
        <!-- Texto para indicar la seleccion -->
        Selecciona el maximo de estudios que tienes:
        <br>
        <!-- Botones de tipo radio con el mismo atributo name para permitir solo una opcion -->
        <input type="radio" name="estudios" value="1">Sin estudios <br>
        <input type="radio" name="estudios" value="2">Primaria <br>
        <input type="radio" name="estudios" value="3">Secundaria <br>
        <input type="radio" name="estudios" value="4">Preparatoria <br>
        <!-- Boton para enviar -->
        <input type="submit" value="enviar">
        <!-- Boton para borrar -->
        <input type="reset" value="borrar">
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
