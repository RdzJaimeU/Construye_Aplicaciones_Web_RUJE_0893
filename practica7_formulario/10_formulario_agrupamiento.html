<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con agrupamiento</title>
    <!-- Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formularios con agrupamiento</h2>
    <!-- Formulario agrupado por secciones -->
    <form action="" method="post">
        <!-- Primer grupo para los datos personales -->
        <fieldset>
            <!-- Titulo descriptivo de la primera seccion -->
            <legend>Datos personales</legend>
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>
            Documento valido:
            <input type="file" name="documento"><br>
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
        </fieldset>

        <!-- Segundo grupo para los datos academicos -->
        <fieldset>
            <!-- Titulo descriptivo de la segunda seccion -->
            <legend>Datos de estudio:</legend>
            Nombre de la escuela:
            <input type="text" name="escuela"><br>
            Certificado valido:
            <input type="file" name="certificado"><br>
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>
        <br>
        <!-- Boton de envio con icono -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
        <!-- Boton de borrado con icono -->
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>

    <br><br>
    <!-- Pie de pagina con mis datos -->
    <footer>
        <p>Alumno: Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
