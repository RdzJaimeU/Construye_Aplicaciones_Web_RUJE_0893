<html> <!-- Le indicamos al navegador que es un documento html -->
  <head> <!-- Metadatos de la pagina -->
    <title> Pagina WEB de ejemplo: texto </title>
  </head> <!-- Nombre de la pagina -->
  <body>
    Esta es linea , y a continuacion insertamos un salto de linea. <br>
    <center> Esta es otra linea </center>
    <!-- Sirve para alinear al centro pero esta descontinuada -->
    Esta es una linea , y a continuacion insertamos un salto de linea <br>
    <p align="left"> El texto alineado a la izquierda </br>
    <!-- Align sirve para alinear el texto en varias opciones -->
    <p align="center"> El texto esta alineado al centro </br>
    <p align="right"> El texto esta alineado a la derecha </br>
  </body>
</html>
