 <h2>Registrarse</h2>
 <form action="#" method="POST">
  <div>
    <label for="nombre">Nombre Completo:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu Nombre Completo" required>
  </div>

    <label for="correo">Correo Electrónico:</label>
    <input type="email" id="correo" name="correo" placeholder="Ingresa tu Correo Electrónico" required>
  </div>

  <div>
    <label for="tarjeta">Número de Tarjeta Club Cinépolis (Opcional):</label>
    <input type="text" id="tarjeta" name="tarjeta" placeholder="Ingresa tu Tarjeta">
  </div>

  <div>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" placeholder="Ingresa tu Contraseña" required>
  </div>

  <button type="submit">Registrarse</button>
</form>
