<!--Esto le indica al navegador que es un documento html-->
<html lang="es">
    <!--Le indicamos que es el idioma español-->
    <head>
        <!--Los metadatos de la pagina-->
        <meta charset="UTF-8">
        <!--Para que la pagina pueda mostrar caracteres especiales-->
        <meta name="viewport" content="width=device-width,initial scale=1.0">
        <!--Para que la pagina sea responsiva y se muestre bien en celulares-->
        <title>Enlaces HTML</title>
        <!--El nombre de la pagina-->
    </head>
    <body>
        <!--Cuerpo de la pagina explicando los diferentes tipos de enlaces-->
      <h2>Tipos de enlaces en html</h2>
      <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.</strong></p>
         <!--Etiqueta para un hipervinculo y hacer referencia a otra-->
         <a href="Hola_mundo.html">1. Hola Mundo</a><br>
         <!--Abre el archivo en la misma pestaña sin abrir uno nuevo-->
         <a href="Encabezados.html" target="_self">2. Encabezados </a><br>
         <!--Abre el archivo en una nueva pagina-->
         <a href="Parrafos.html" target="_blank">3. Parrafos</a><br>
         <!--Muestra el archivo en el documento padre o en la misma pagina si no existe-->
         <a href="Salto_de_linea.html" target="_parent">4. Salto de Linea</a><br>
         <!--Abre el archivo en un iframe-->
         <a href="Enfatizado.html" target="_top">5.Enfatizado</a><br>
         <p><strong>Enlaces Hipervinculos a sitios externos</strong></p>
         <a href="https://www.google.com/">Google</a><br>
         <!--Abre el link en la misma pagina-->
         <a href="https://www.youtube.com/" target="_self">Youtube</a><br>
         <!--Abre el link en una nueva pagina-->
         <a href="https://www.facebook.com/" target="_blank">Facebook</a><br>
         <!--Abre el link en la pagina padre o en la misma si es que no hay-->
         <a href="https://www.wikipedia.com/" target="_parent">Wikipedia</a><br>
         <!--Abre el link en un iframe-->
         <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo</a><br>
    </body>
</html>
