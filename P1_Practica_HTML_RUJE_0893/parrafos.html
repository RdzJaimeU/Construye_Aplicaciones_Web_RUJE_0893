<!DOCTYPE html>

<!--Esto le indica al navegador que es un documento html-->
<html lang="es">
    <!--Le indicamos que es el idioma español-->
    <head>
        <!--Los metadatos de la pagina-->
        <meta charset="UTF-8">
        <!--Para que la pagina pueda mostrar caracteres especiales-->
        <meta name="viewport" content="width=device-width,initial scale=1.0"
        <!--Para que la pagina sea responsiva y se muestre bien en celulares-->
        <title>Parrafos HTML</title>
        <!--El nombre de la pagina-->
    </head>
        <body>
            <!--Encabezados para explicar cada elemento de un documento html-->
            <h1>Estructura del HTML</h1>
            <h2>HTML</h2>
            <!--Parrafo para mostrarlo al usuario visualmente-->
            <p>Envuelve todo el contenido de la pagina</p>
            <h2>HEAD</h2>
            <p>
                Contiene los metadatos del sitio web,configuraciones y el titulo de la pestaña
            </p>
            <h2>Body</h2>
            <p>Muestra los elementos visuales que ve el usuario</p>
            <h2>Footer</h2>
            <p>
                Muestra la informacion del autor de la pagina,creditos,informacion relevante, etc
            </p>
        </body>
    </html>
