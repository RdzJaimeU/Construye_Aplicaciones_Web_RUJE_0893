<!DOCTYPE html>

<!--Esto le indica al navegador que es un documento html-->
<html lang="es">
    <!--Le indicamos que es el idioma español-->
    <head>
        <!--Los metadatos de la pagina-->
        <meta charset="UTF-8">
        <!--Para que la pagina pueda mostrar caracteres especiales-->
        <meta name="viewport" content="width=device-width,initial scale=1.0">
        <!--Para que la pagina sea responsiva y se muestre bien en celulares-->
        <title>Encabezados HTML</title>
        <!--El nombre de la pagina-->
    </head>
    <body>
    <h2>Imagenes en HTML</h2>
    <h3>Locales</h3>
    <!--Etiqueta de imagen para colocarla en la página poniendo la carpeta y nombre de la imagen para ponerla-->
    <img src="imagenes/carita.png" alt="Imagen de Carita feliz">
    <h3>Locales Redimensionados</h3>
<!--Misma Imagen pero con tamaño cambiado-->
    <img src="imagenes/carita.png" alt="Imagen de Carita feliz" width="200" height="100">
    <h3>Desde internet</h3>
   <!--Ahora la imagen se esta trayendo desde internet y se le asigno un tamaño y altura específicos-->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <h3>Animaciones</h3>
 <!--Ahora en vez de ser una imagen estatica es un gif para que se muestre de manera animada-->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
    </body>
</html>
