<!DOCTYPE html>
<!-- Rodriguez Ugalde Jaime Emmanuel 5°J 0893 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con Radioboton</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formularios con Radioboton</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Selecciona el maximo de estudios que tienes:
        <br>
        <!-- botones radio con el mismo name para que solo se pueda elegir una sola opcion -->
        <input type="radio" name="estudios" value="1">Sin estudios <br>
        <input type="radio" name="estudios" value="2">Primaria <br>
        <input type="radio" name="estudios" value="3">Secundaria <br>
        <input type="radio" name="estudios" value="4">Preparatoria <br>
        <!-- boton para enviar -->
        <input type="submit" value="enviar">
        <!-- boton para borrar -->
        <input type="reset" value="borrar">
    </form>

    <br><br>
    <footer>
        <p>Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
