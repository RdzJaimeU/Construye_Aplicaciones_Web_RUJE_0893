<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para contraseñas</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario para contraseñas</h2>
    <form action="" method="post">
        Ingresa tu usuario:
        <!-- caja de texto normal para el usuario -->
        <input type="text" name="usuario">
        <br>
        Ingresa tu contraseña:
        <!-- campo password para que la contrasena salga con asteriscos o puntos y no se vea -->
        <input type="password" name="pass">
        <br>
        <!-- boton para enviar -->
        <input type="submit" value="enviar">
        <!-- boton reset para limpiar las cajas si me equivoco -->
        <input type="reset" value="borrar">
    </form>

    <br><br>
    <footer>
        <p>Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
