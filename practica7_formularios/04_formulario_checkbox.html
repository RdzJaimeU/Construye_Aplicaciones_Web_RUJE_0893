<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con checkbox</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formularios con checkbox</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Selecciona los lenguajes que conozcas:
        <br>
        <!-- casillas checkbox para poder seleccionar varias opciones a la vez -->
        <input type="checkbox" name="Java">Java <br>
        <input type="checkbox" name="Python"> Python <br>
        <input type="checkbox" name="C#">C# <br>
        <input type="checkbox" name="Flutter"> Flutter <br>
    </form>

    <br><br>
    <footer>
        <p>Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
