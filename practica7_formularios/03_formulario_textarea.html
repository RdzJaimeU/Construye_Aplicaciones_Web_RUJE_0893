<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con text area</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con text area</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Ingresa tu correo:
        <!-- tipo email para que valide que tenga arroba y dominio -->
        <input type="email" name="correo">
        <br>
        Ingresa tus comentarios:
        <!-- textarea para poder escribir varias lineas de texto -->
        <textarea name="comentarios" rows="1" cols="10"></textarea>
        <br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>

    <br><br>
    <footer>
        <p>Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
