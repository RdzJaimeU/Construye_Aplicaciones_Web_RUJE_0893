<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con limitaciones</title>
    <!-- Libreria de iconos en linea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con limitaciones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <br>
        <!-- disabled para bloquear la caja y que no se pueda escribir nada -->
        <input type="text" name="nombre" disabled><br>
        Contraseña:
        <br>
        <!-- maxlength 5 para que no deje escribir mas de 5 letras -->
        <input type="password" name="pass" maxlength="5"><br>
        Comentarios:
        <br>
        <!-- readonly para que solo se pueda leer y no se pueda borrar ni modificar -->
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>

    <br><br>
    <footer>
        <p>Rodriguez Ugalde Jaime Emmanuel 5°J 0893</p>
    </footer>
</body>
</html>
